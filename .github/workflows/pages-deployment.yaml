on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build
        env:
          GOOGLE_TAGMANAGER_ID: ${{ secrets.GOOGLE_TAGMANAGER_ID }}
          GOOGLE_TAGMANAGER_AUTH: ${{ secrets.GOOGLE_TAGMANAGER_AUTH }}
          GOOGLE_TAGMANAGER_PREVIEW: ${{ secrets.GOOGLE_TAGMANAGER_PREVIEW }}
        run: |
          nix develop -c pnpm install --frozen-lockfile
          nix develop -c pnpm run check:content
          nix develop -c pnpm run build
          nix develop -c pnpm run check:build-output
      - name: Add pnpm to PATH for Wrangler Action
        run: |
          nix develop -c bash -lc 'printf "%s\n" "$(dirname "$(command -v pnpm)")" >> "$GITHUB_PATH"'
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy --project-name=incipe-dev dist
      - name: Check deployed site
        run: nix develop -c pnpm run check:deployed-site
